name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, import rules, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy (strict)
        run: uv run mypy

      - name: Import rules
        run: uv run lint-imports

      - name: Tests with coverage
        run: uv run pytest --cov=aitrader --cov-report=term-missing

      - name: Coverage gate for the core packages (>= 90%)
        run: >-
          uv run coverage report
          --include='src/aitrader/domain/*,src/aitrader/config/*,src/aitrader/clock/*,src/aitrader/fees/*,src/aitrader/risk/*,src/aitrader/portfolio/*,src/aitrader/execution/*,src/aitrader/broker/*'
          --fail-under=90

      - name: CLI smoke test
        run: |
          uv run aitrader --version
          uv run aitrader config validate --mode backtest --config-dir config
          uv run aitrader config validate --mode paper --config-dir config
          set +e
          uv run aitrader live
          code=$?
          set -e
          test "$code" -eq 3
